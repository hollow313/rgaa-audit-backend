name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  DEFAULT_IMAGE_NAME: hollow313/rgaa-audit-backend

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

  build-and-push:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker Hub credentials
        if: github.event_name != 'pull_request' && (secrets.DOCKERHUB_TOKEN == '' && secrets.DOCKER_PASSWORD == '' && secrets.DOCKERHUB_PASSWORD == '')
        run: |
          echo "::warning::Docker Hub credentials not found in GitHub Secrets (DOCKERHUB_TOKEN or DOCKER_PASSWORD). Image build will proceed without push."

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && (secrets.DOCKERHUB_TOKEN != '' || secrets.DOCKER_PASSWORD != '' || secrets.DOCKERHUB_PASSWORD != '')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_USERNAME || (secrets.DOCKER_USERNAME != '' && secrets.DOCKER_USERNAME || 'hollow313') }}
          password: ${{ secrets.DOCKERHUB_TOKEN != '' && secrets.DOCKERHUB_TOKEN || (secrets.DOCKER_PASSWORD != '' && secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_PASSWORD) }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_REPO || env.DEFAULT_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' && (secrets.DOCKERHUB_TOKEN != '' || secrets.DOCKER_PASSWORD != '' || secrets.DOCKERHUB_PASSWORD != '') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
